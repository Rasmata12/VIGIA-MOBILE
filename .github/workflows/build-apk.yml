name: Build VIGIA AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    name: Compiler l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Autoriser l'exécution de gradlew
        run: chmod +x android/gradlew || true

      - name: Compiler l'APK debug (installable directement)
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Publier l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: vigia-ai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
