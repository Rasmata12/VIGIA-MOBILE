name: Compiler VIGIA AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Compilation de l'APK VIGIA AI (assembleDebug)
        run: |
          echo "=== Verification des dossiers ==="
          ls -la
          
          if [ -d "vigia-app" ]; then
            echo "Dossier vigia-app trouve"
            cd vigia-app
          elif [ -f "build.gradle.kts" ]; then
            echo "Fichiers Android trouves a la racine"
          fi
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Mettre a disposition l'APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: VIGIA-AI-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
